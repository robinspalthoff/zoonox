services:

  # ─── Dashboard (Next.js) ────────────────────────────────────────
  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AUTH_URL=${AUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - KOSIT_VALIDATOR_URL=http://kosit-validator:80
    depends_on:
      postgres:
        condition: service_healthy
      kosit-validator:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  # ─── Worker (recurring invoices, future background jobs) ────────
  # Long-running Node process. Uses pg-boss on top of Postgres for
  # cron + retry + dead-letter — no Redis or external scheduler.
  # Scale via `docker compose up -d --scale worker=N`; pg-boss
  # distributes jobs via SKIP LOCKED so replicas don't collide.
  worker:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    # ROLE=worker lässt das entrypoint.sh den gebündelten Worker starten
    # (dist/worker.cjs) statt des Next.js-Servers. Kein `command`-Override:
    # das entrypoint ignoriert Argumente und würde sonst wieder server.js starten.
    environment:
      - ROLE=worker
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - WORKER_TICK_CRON=${WORKER_TICK_CRON:-0 * * * *}
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-info}
      # Brevo credentials — needed for auto-send of generated invoices.
      - BREVO_API_KEY=${BREVO_API_KEY}
      - PLATFORM_SENDER_EMAIL=${PLATFORM_SENDER_EMAIL}
      - PLATFORM_NAME=${PLATFORM_NAME}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    # No traefik labels — worker has no public surface.

  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zoonox}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5



  # ─── KOSIT Validator (E-Invoice XML Validation) ─────────────────
  kosit-validator:
    image: backofficeplus/e-invoice-validator:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # No external port — only reachable from internal Docker network

  # ─── Traefik (Reverse Proxy + SSL) ──────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt

volumes:
  postgres_data:
  traefik_certs:
  